<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Paciente</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <!-- Cabeçalho Principal -->
        <header class="form-header">
            <h1>Cadastrar</h1>
            <h2>Paciente</h2>
        </header>

        <form>
            <!-- CARD 1: Dados Pessoais -->
            <fieldset class="card">
                <legend>Dados Pessoais</legend>
                
                <div class="input-group full-width">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" placeholder="Digite o nome completo" required>
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" placeholder="000.000.000-00" required>
                    </div>

                    <div class="input-group">
                        <label for="sexo">Sexo Biológico</label>
                        <select id="sexo" required>
                            <option value="" disabled selected>Selecione</option>
                            <option value="masculino">Masculino</option>
                            <option value="feminino">Feminino</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="nascimento">Data de Nascimento</label>
                        <input type="date" id="nascimento" required>
                    </div>
                </div>

                <div class="input-group full-width">
                    <label for="endereco">Endereço</label>
                    <input type="text" id="endereco" placeholder="Rua, número, bairro, cidade e estado" required>
                </div>
            </fieldset>

            <!-- CARD 2: Contatos e Informações Médicas -->
            <fieldset class="card">
                <legend>Contatos e Convênio</legend>

                <div class="input-row">
                    <div class="input-group">
                        <label for="telefone">Telefone</label>
                        <input type="tel" id="telefone" placeholder="(00) 00000-0000" required>
                    </div>

                    <div class="input-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" placeholder="exemplo@email.com" required>
                    </div>
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label for="convenio">Convênio</label>
                        <input type="text" id="convenio" placeholder="Nome do plano ou 'Particular'">
                    </div>

                    <div class="input-group">
                        <label for="emergencia">Contato de Emergência</label>
                        <input type="tel" id="emergencia" placeholder="Nome e telefone de um familiar" required>
                    </div>
                </div>
            </fieldset>

            <!-- Botão de Envio -->
            <div class="form-actions">
               <button type="submit" class="btn-submit"> <a href="../index.html">Salvar Cadastro</a></button>
            </div>
        </form>
    </div>

</body>
</html>
