    <header class="topo">
        <h1>Sistema Hospitalar</h1>
        <p class="slq">Módulo: Atendimento Médico</p>
    </header>

    <div class="container mt-4">
        <div class="card-box">
            <h3>Prontuário do paciente</h3>

            <div class="row">
                <div class="col-md-6">
                    <p><strong>Nome:</strong> João da Silva</p>
                    <p><strong>CPF:</strong> 000.000.000-00</p>
                    <p><strong>Data de Nascimento:</strong> 01/01/1990</p>
                </div>

                <div class="col-md-6">
                    <p><strong>Sexo:</strong> Masculino</p>
                    <p><strong>Telefone:</strong> (61) 99999-9999</p>
                    <p><strong>Convênio:</strong> SUS</p>
                </div>
            </div>
        </div>
    

    <div class="card-box">

        <h3>Registro do Atendimento</h3>
        
        <div class="campo">
            <label>CRM do Médico:</label>
            <textarea name="" id="" placeholder="Digite o CRM"></textarea>
        </div>

        <div class="campo">
            <label>Anamnese:</label>
            <textarea placeholder="Descreva os sintomas do paciente"></textarea>
        </div>

        <div class="campo">
            <label>Tempo de evolução</label>
            <textarea name="" id="" placeholder="A quanto tempo os sintomas iniciaram"></textarea>
        </div>

        <div class="campo">
            <label>Sinais vitais</label>
            <textarea name="" id="" placeholder="Temperatura, pressão arterial e frequência Cardiaca"></textarea> 
        </div>

        <div class="campo">
                <label> Nível de Consciência:</label> 
                <textarea placeholder=" Escala de Coma de Glasgow (se indicado)."></textarea>
            </div> 
            
            
            <div class="campo">
                <label>Histórico da Moléstia Atual (HDA):</label> 
                <textarea placeholder="  Cronologia detalhada dos sintomas."></textarea>
            </div> 

            
            <div class="campo">
                <label>Medicamentos em Uso:</label> 
                <textarea placeholder="  Especial atenção a anticoagulantes, antiepilépticos ou psicoativos."></textarea>
            </div> 

            
            <div class="campo">
                <label>Alergias:</label> 
                <textarea placeholder="  Registro visível de alergia a medicamentos."></textarea>
            </div> 

            
            <div class="campo">
                <label>Histórico Familiar: </label> 
                <textarea placeholder="  Doenças neurológicas na família (Ataxia, Huntington, etc.)."></textarea>
            </div> 

            
            <div class="campo">
                <label>Encaminhamento/Documento de Origem: </label> 
                <textarea placeholder=" Se veio de UBS ou emergência."></textarea>
            </div> 


            <div class="campo">
                <label>Encaminhamento/Documento de Origem: </label> 
                <textarea placeholder=" Se veio de UBS ou emergência."></textarea>
            </div> 

        <div class="campo">
            <label>Exame Físico:</label>
            <textarea placeholder="Resultados de exames físicos"></textarea>
        </div>

        <div class="campo">
            <label>Diagnóstico (CID-10):</label>
             <textarea name="" id="" placeholder="EX: A00"></textarea>
        </div>

        <div class="campo">
            <label>Solicitação de Exames:</label>
            <textarea placeholder="Solicitar exames ou procedimentos"></textarea>
        </div>

        <div class="botoes">
            <a href="../prescricao/index.html" class="link-btn"><button class="btn-salvar">Fazer prescrição:</button></a>
            <button class="btn-secundario">Cancelar</button>
        </div>
