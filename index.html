<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">
        <h1>Login</h1>
        
        <form>
            <div class="input-group">
                <label for="username">Usuário</label>
                <input type="text" id="username" placeholder="Digite seu usuário" required>
            </div>

            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="Digite sua senha" required>
            </div>

            <div class="forgot-password">
                <a href="/projetohospital/senha/senha.html">Esqueceu a senha?</a>
            </div>

            <button type="submit" class="btn-login"><a href="./triagem1/index.html">Login</a></button>
        </form>

        <div class="register-link">
            <p>Não tem uma conta? <a href="./cadastropaciente/index.html">Cadastrar (paciente)</a></p>
            <p>Não tem uma conta? <a href="./funcionario/index.html">Cadastrar (funcionário)</a></p>
        </div>
    </div>

</body>
</html>
