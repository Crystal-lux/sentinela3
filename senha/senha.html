<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - VS Code Style</title>
    <!-- Vincula o arquivo CSS externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card-container">
        <h2>Perdeu a senha?</h2>
        <p>Insira o endereço de e-mail associado à sua conta e enviaremos um link para você redefinir sua senha.</p>
        
        <form>
            <div class="form-group">
                <label for="email">E-mail de Cadastro</label>
                <input type="email" id="email" placeholder="exemplo@email.com" required>
            </div>
            
            <button type="submit" class="btn-enviar">
                Enviar Link de Recuperação
            </button>
        </form>

        <a href="../index.html" class="voltar-link">Voltar para o Login</a>
    </div>

</body>
</html>
